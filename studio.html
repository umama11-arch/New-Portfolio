<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color: #fff9f8;
            color: #333333;
        }
        .navbar{
            height: 60px;
            background-color: #fff9f8;
            font-size: 20px;
        }
        .hero{
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 500px;
            background: linear-gradient(rgba(122,122,122,0.4),rgba(122,122,122,0.4)),
            url("WhatsApp Image 2026-02-07 at 1.31.31 PM.jpeg");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }
        .nav-item a:hover,
        .nav-item a:active{
            color: #ff6f91;
        }
        .herobuttons{
            display: flex;
            gap: 10px;
        }
        .btn{
            background-color: #ff6f91;
            border-radius: 15px;
            padding: 8px 20px;
            font-weight: bold;
            color: #fff;
            height: 50px;
        }
        .btn:hover{
            background-color: #d8a1b4;
        }

        /* ===== GALLERY ===== */
        .gallery{
            background-color: #fff3f6;
            display: flex;
            flex-direction: column;
            align-items:center ;
            padding-top: 40px;
        }
        .gallerymain{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 15px;
        }
        .galleryheading{
            font-size: 56px;
            font-weight: 700;
        }
        .gallerytext{
            color: #666666;
            font-size: 22px;
        }
        .card{
            background-color: #ffeff2;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.3s ease;
        }
        .card:hover{
            transform: translateY(-10px);
        }
        .card img{
            height: 60%;
            width: 60%;
            border-radius: 10px;
            cursor: pointer;
        }
        .cardbtn{
            background-color: #ff6f91;
            border-radius: 7px;
            border: 2px solid #ff6f91;
            width: 100px;
            height: 40px;
            color: #fff;
        }
        .cardheading{
            color: #666666;
            font-size: 30px;
        }
        .btns{
            display: flex;
            gap: 8px;
        }

        /* ===== FORM (FIXED ONLY) ===== */
        .customized{
            margin-top: 100px;
            margin-bottom: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .enter{
            background-color: #fff;
            width: 500px;
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #ff6f91;
        }
        .customizform{
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        textarea{
            width: 100%;
            height: 120px;
            border-radius: 10px;
            padding: 10px;
        }
        .label{
            font-weight: 600;
        }
    </style>
</head>

<body>

<header>
<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a href="#" class="navbar-brand">KHADIJA</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a href="#heroid" class="nav-link">About</a></li>
                <li class="nav-item"><a href="#gallery" class="nav-link">Gallery</a></li>
                <li class="nav-item"><a href="#customizedid" class="nav-link">Order Customized</a></li>
            </ul>
        </div>
    </div>
</nav>
</header>

<section class="hero" id="heroid">
    <div class="herobuttons">
        <button class="btn px-5" id="viewgallery">View Gallery</button>
        <button class="btn px-5" id="customizeorder">Customize Paintings</button>
    </div>
</section>

<section class="gallery" id="gallery">
    <h1 class="galleryheading">Sketches</h1>
    <h3 class="gallerytext">Every Sketch has Something to Say</h3>

    <div class="gallerymain">
        <!-- ALL 8 CARDS SAME AS YOURS (UNCHANGED) -->
        <!-- card 1 to 8 exactly same -->
    </div>
</section>

<!-- ===== FORM SECTION (CLEANED) ===== -->
<section class="customized" id="customizedid">
    <h2 class="customizheading">Customize Your Sketches</h2>
    <h4 class="customiztext">Enter your Requirements Here</h4>

    <div class="enter">
        <form class="customizform">
            <label class="label">What exactly is your sketch?</label>

            <select class="form-control">
                <option>Person</option>
                <option>Nature</option>
                <option>For Your Brand</option>
                <option>Something Else</option>
            </select>

            <textarea placeholder="Enter your requirements here"></textarea>

            <button type="submit" class="btn px-5">Submit</button>
        </form>
    </div>
</section>

<script>
document.querySelectorAll('.order').forEach(button=>{
    button.addEventListener('click',function(e){
        e.preventDefault();
        const card=this.closest('.card').getAttribute('data-card-id');
        const msg=`I want to order sketch ID: ${card}`;
        window.open(`https://wa.me/923140441410?text=${encodeURIComponent(msg)}`,'_blank');
    });
});

document.getElementById('viewgallery').onclick=()=>{
    document.getElementById('gallery').scrollIntoView();
};
document.getElementById('customizeorder').onclick=()=>{
    document.getElementById('customizedid').scrollIntoView();
};
</script>

</body>
</html>
